name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REMOTE_REPO: /opt/nexos-icp-github
  CONTAINER_NAME: nexos-icp

jobs:
  deploy:
    name: Deploy NEXOS CRM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh $VPS_USER@$VPS_HOST << 'ENDSSH'
            set -e
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 NEXOS CRM Deploy Started"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Pull latest code
            cd ${{ env.REMOTE_REPO }}
            echo "→ Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            COMMIT=$(git rev-parse --short HEAD)
            echo "✓ Code updated to $COMMIT"
            
            # Build Docker image
            RELEASE="$(date -u +%Y%m%dT%H%M%SZ)-$COMMIT-$RANDOM"
            IMAGE_TAG="${{ env.CONTAINER_NAME }}:$RELEASE"
            echo "→ Building Docker image: $IMAGE_TAG"
            docker build --target runtime -f Dockerfile.icp -t "$IMAGE_TAG" . > /tmp/build.log 2>&1 || {
              echo "✗ Build failed:"
              tail -50 /tmp/build.log
              exit 1
            }
            echo "✓ Image built"
            
            # Stop current container
            if docker ps -q -f name=${{ env.CONTAINER_NAME }} > /dev/null 2>&1; then
              echo "→ Stopping current container..."
              docker rename ${{ env.CONTAINER_NAME }} "nexos-icp-backup-$RELEASE" 2>/dev/null || true
              docker stop "nexos-icp-backup-$RELEASE" 2>/dev/null || true
              echo "nexos-icp-backup-$RELEASE" > /opt/nexos-icp-config/previous-container
              echo "✓ Current container stopped"
            fi
            
            # Start new container
            echo "→ Starting new container..."
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --label com.integrator.app=nexos-icp \
              --restart unless-stopped \
              --network icontainer-network \
              --env-file /opt/nexos-icp-config/app.env \
              -e NODE_ENV=production \
              -p 127.0.0.1:3015:3000 \
              --mount type=volume,src=nexos-icp-uploads,dst=/app/apps/api/uploads \
              --mount type=volume,src=nexos-icp-attachments,dst=/app/apps/attachments/editais \
              "$IMAGE_TAG" > /dev/null
            echo "✓ Container started"
            
            # Health check
            echo "→ Waiting for health check..."
            for i in {1..60}; do
              HEALTH=$(docker inspect -f '{{.State.Health.Status}}' ${{ env.CONTAINER_NAME }} 2>/dev/null || echo "starting")
              if [[ "$HEALTH" == "healthy" ]]; then
                echo "✓ Container healthy"
                break
              fi
              if [[ "$HEALTH" == "unhealthy" ]]; then
                echo "✗ Container unhealthy"
                docker logs ${{ env.CONTAINER_NAME }} --tail 50
                exit 1
              fi
              [[ $i -eq 60 ]] && { echo "✗ Health check timeout"; docker logs ${{ env.CONTAINER_NAME }} --tail 50; exit 1; }
              sleep 2
            done
            
            # Test endpoint
            echo "→ Testing endpoint..."
            curl -sf http://127.0.0.1:3015/api/health > /dev/null || {
              echo "✗ Health endpoint failed"
              docker logs ${{ env.CONTAINER_NAME }} --tail 50
              exit 1
            }
            echo "✓ Endpoint responding"
            
            # Cleanup
            if [[ -f /opt/nexos-icp-config/previous-container ]]; then
              prev=$(cat /opt/nexos-icp-config/previous-container)
              docker rm "$prev" 2>/dev/null || true
            fi
            
            # Keep only last 5 images
            docker images --format "{{.Repository}}:{{.Tag}}" | grep "^${{ env.CONTAINER_NAME }}:" | tail -n +6 | xargs -r docker rmi 2>/dev/null || true
            
            echo "$RELEASE" > /opt/nexos-icp-config/current-release
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ Deploy Completed Successfully"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Release: $RELEASE"
            echo "Commit: $COMMIT"
            echo "URL: https://nexos.chorstconsult.com.br"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          ENDSSH

      - name: Rollback on failure
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          echo "⚠️ Deploy failed. Attempting rollback..."
          ssh $VPS_USER@$VPS_HOST << 'ENDSSH'
            if [[ -f /opt/nexos-icp-config/previous-container ]]; then
              prev=$(cat /opt/nexos-icp-config/previous-container)
              docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
              docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true
              docker rename "$prev" ${{ env.CONTAINER_NAME }} 2>/dev/null || true
              docker start ${{ env.CONTAINER_NAME }} 2>/dev/null || true
              echo "✓ Rollback completed"
            else
              echo "No previous container for rollback"
            fi
          ENDSSH
          echo "::error::Deploy failed. Previous version restored if available."

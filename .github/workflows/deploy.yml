name: Deploy CRM Nexo Integrator v2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Integrator VPS
    runs-on: ubuntu-latest

    steps:
      - name: Executar Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /var/www/crmnexointegrator_v2

            echo ">>> Atualizando código a partir da branch main..."
            git fetch origin main
            git reset --hard origin/main

            echo ">>> Instalando dependências..."
            npm install --production=false

            echo ">>> Gerando build do projeto..."
            npm run build

            echo ">>> Reiniciando aplicação no PM2..."
            pm2 reload crmnexointegrator_v2_3025 || pm2 restart crmnexointegrator_v2_3025

            echo ">>> Deploy finalizado com sucesso!"

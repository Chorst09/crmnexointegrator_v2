name: Deploy CRM Nexo Integrator v2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      domain:
        description: "Domínio de destino (ex.: nexosv2.cnorstconsult.com.br)"
        required: false
        default: "nexosv2.cnorstconsult.com.br"

env:
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_PORT: ${{ secrets.SSH_PORT }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  deploy:
    name: Deploy na VPS via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

      - name: Executar Deploy na VPS
        run: |
          DOMAIN="${{ github.event.inputs.domain }}"
          echo "🚀 Deploy para $DOMAIN (host ${{ env.SSH_HOST }})"

          ssh -p ${{ env.SSH_PORT }} ${{ env.SSH_USER }}@${{ env.SSH_HOST }} <<'ENDSSH'
            set -e
            echo "📂 Entrando em /var/www/nexosv2"
            cd /var/www/nexosv2

            echo "🔄 Atualizando código a partir da branch main..."
            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "📦 Instalando dependências..."
            cd apps/api
            npm install --production
            cd ../../apps/web
            npm install
            npm run build

            echo "🔄 Reiniciando aplicação (PM2)..."
            pm2 restart nexosv2-api || pm2 restart all

            echo "✅ Deploy finalizado com sucesso!"
          ENDSSH
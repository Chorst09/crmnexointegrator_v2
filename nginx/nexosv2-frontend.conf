# Include inside the HTTPS server for nexosv2.chorstconsult.com.br.
# HTML must be refreshed after deployment; Vite's hashed assets can be cached.
location = /index.html {
    root /var/www/crmnexointegrator_v2/apps/web/dist;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files /index.html =404;
}

location ^~ /assets/ {
    root /var/www/crmnexointegrator_v2/apps/web/dist;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
